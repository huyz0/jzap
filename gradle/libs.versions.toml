[versions]
asm = "9.10.1"
jackson = "2.22.2"
junit = "5.14.0"
junitPlatform = "1.14.0"
jgit = "7.7.1.202607240634-r"
picocli = "4.7.7"
pitest = "1.30.0"
pitestJunit5 = "1.2.3"
slf4j = "2.0.17"
kotlin = "2.4.0"
kotest = "6.2.5"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
plugin-publish = { id = "com.gradle.plugin-publish", version = "2.2.1" }

[libraries]
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
asm-util = { module = "org.ow2.asm:asm-util", version.ref = "asm" }
asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }
jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "jgit" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
pitest = { module = "org.pitest:pitest", version.ref = "pitest" }
pitest-entry = { module = "org.pitest:pitest-entry", version.ref = "pitest" }
pitest-command-line = { module = "org.pitest:pitest-command-line", version.ref = "pitest" }
pitest-junit5-plugin = { module = "org.pitest:pitest-junit5-plugin", version.ref = "pitestJunit5" }
