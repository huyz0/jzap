# Publishes a release, on a v* tag.
#
# Two destinations, because they serve different resolvers: the eight library modules go to Maven
# Central, and the Gradle plugin goes to the Gradle Plugin Portal, which is where
# `plugins { id "io.github.huyz0.jzap" }` resolves from.
#
# The whole build runs first and the job stops on any failure, because a published version cannot
# be withdrawn -- Maven Central is immutable by design. The parity gate is part of that: shipping a
# version whose verdicts disagree with PIT would be shipping a wrong answer confidently.
#
# The Central deployment is AUTOMATIC, so a green run publishes without further input. What
# stands in for the missing pause is everything above it: the suite, the coverage floor, the PIT
# parity oracle, the Maven smoke test, and a plugin validation against the Portal -- all before
# anything is uploaded. Central is immutable, so a tag is the decision to publish.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 0.1.0).'
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only to create the GitHub release at the end. Everything before it reads.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          case "$version" in
            *-SNAPSHOT) echo "refusing to release a snapshot: $version" >&2; exit 1 ;;
            "")         echo "could not determine a version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      # Everything that gates a change, before anything leaves the machine.
      - name: Build, test and coverage floor
        run: ./gradlew build -PjzapVersion=${{ steps.version.outputs.version }} --stacktrace

      - name: Verdict parity against PIT
        run: ./gradlew :tools:parity:parity --stacktrace

      - name: Maven plugin smoke test
        run: ./gradlew mavenSmokeTest --stacktrace

      # Before anything is uploaded anywhere. This checks the Portal credentials and the plugin's
      # metadata without publishing, so a bad key or a rejected id fails here rather than after
      # Central has already taken the bundle -- and with AUTOMATIC publishing there is nothing
      # left to clean up by hand, because by then it is released. Neither destination is
      # revocable, so the only place to catch this is before the upload.
      - name: Validate the Gradle plugin without publishing it
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          ./gradlew :jzap-gradle:publishPlugins --validate-only \
            -PjzapVersion=${{ steps.version.outputs.version }} --stacktrace

      - name: Build the Central bundle
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_KEY_PASSWORD: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
        run: ./gradlew centralBundle -PjzapVersion=${{ steps.version.outputs.version }} --stacktrace

      # Kept whatever happens next. If the upload fails, this is the artefact to retry with, and
      # it is exactly what was signed rather than a rebuild of it.
      - name: Keep the bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-bundle
          path: build/central/*.zip
          retention-days: 90
          if-no-files-found: warn

      - name: Upload to the Central Portal
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bundle="build/central/jzap-${VERSION}-bundle.zip"
          token=$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)
          # AUTOMATIC: Central validates and then releases without waiting for anyone. The gates
          # above are what stands in for the pause -- the full suite, the parity oracle, the Maven
          # smoke test and a plugin validation, all before a single byte is uploaded. A person
          # clicking publish on a deployment they have not inspected was never really a check.
          status=$(curl -sS -o response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $token" \
            -F "bundle=@${bundle}" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=jzap-${VERSION}&publishingType=AUTOMATIC")
          echo "HTTP $status"
          cat response.txt
          if [ "$status" != "201" ]; then
            echo "::error::the Central Portal rejected the upload; see the body above" >&2
            exit 1
          fi
          echo
          echo "::notice::Uploaded and releasing automatically. Progress: https://central.sonatype.com/publishing/deployments"
          echo "::notice::Validation takes a few minutes, and Central can still reject it after this step reports success"

      - name: Publish the Gradle plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          ./gradlew :jzap-gradle:publishPlugins \
            -PjzapVersion=${{ steps.version.outputs.version }} --stacktrace

      # Last, so it exists only for a release that actually got published. Central validates
      # asynchronously and takes a few minutes to become resolvable, which the notes say -- a
      # release page implying the coordinates work immediately sends people to debug their own
      # build.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          notes=$(cat <<NOTES
          Fast, diff-aware mutation testing for Java and Kotlin.

          Documentation: https://huyz0.github.io/jzap/

          ## Using it

          Gradle:

              plugins { id 'io.github.huyz0.jzap' version '${VERSION}' }

          Maven:

              <groupId>io.github.huyz0</groupId>
              <artifactId>jzap-maven-plugin</artifactId>
              <version>${VERSION}</version>

          With a coding agent:

              npx skills add huyz0/jzap

          ## Availability

          The Gradle plugin is live on the Plugin Portal. The engine modules are published to
          Maven Central, which validates asynchronously: allow a few minutes before they resolve
          from repo1, and longer before they are searchable. The Maven plugin is released
          separately.
          NOTES
          )
          gh release create "v${VERSION}" \
            --title "jzap ${VERSION}" \
            --notes "$notes" \
            build/central/jzap-${VERSION}-bundle.zip
